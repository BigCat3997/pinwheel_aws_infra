trigger:
  - main

resources:
  repositories:
    - repository: templates
      type: github
      name: bigcat3997/one-press-ado-templates
      endpoint: github.com_BigCat3997
      ref: refs/heads/tidy
    - repository: terraform-aws
      type: github
      name: bigcat3997/pinwheel-aws-infra
      endpoint: github.com_BigCat3997
      ref: refs/heads/develop

parameters:
  - name: createSSHKey
    displayName: Create SSH Key
    type: boolean
    default: false

extends:
  template: templates/workflow-terraform-apply2.yml@templates
  parameters:
    runningAgent: ubuntu-latest
    tfWorkDir: pinwheel-aws-infra/modules/impl/code-commit
    tfVarsFile: envs/prd.tfvars
    runMigrateState: false
    createSSHKey: ${{ parameters.createSSHKey }}
    sshKeyName: ec2-key
    backendAWSBucket: $(backendAWSBucket)
    backendAWSKey: $(backendAWSKey)
    backendAWSDynamoDBTable: $(backendAWSDynamoDBTable)
    backendAWSRegion: $(AWS_REGION)
    awsAccessKeyId: $(AWS_ACCESS_KEY_ID)
    awsSecretAccessKey: $(AWS_SECRET_ACCESS_KEY)
    awsRegion: $(AWS_REGION)
    dependencies:
      - checkout: self
      - checkout: terraform-aws
