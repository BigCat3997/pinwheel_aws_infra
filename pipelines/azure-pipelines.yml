trigger:
  - main

resources:
  repositories:
    - repository: templates
      type: github
      name: bigcat3997/one-press-ado-templates
      endpoint: github.com_BigCat3997
      ref: refs/heads/tidy
    - repository: terraform-aws
      type: github
      name: bigcat3997/pinwheel-aws-infra
      endpoint: github.com_BigCat3997
      ref: refs/heads/main

extends:
  template: templates/workflow-terraform-simple.yml@templates
  parameters:
    runningAgent: ubuntu-latest
    tfWorkDir: pinwheel-aws-infra/modules/impl/iam
    tfVarsFile: envs/dev.tfvars
    runApply: false
    backendAWSServiceConnection: $(backendAWSServiceConnection)
    backendAWSBucket: $(backendAWSBucket)
    backendAWSKey: $(backendAWSKey)
    backendAWSRegion: $(backendAWSRegion)
    backendAWSDynamoDBTable: $(backendAWSDynamoDBTable)
    dependencies:
      - checkout: self
      - checkout: terraform-aws
